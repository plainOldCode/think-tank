<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tt · mobile</title>
<link rel="stylesheet" href="/css/mobile.css?v=themes">
</head>
<body class="tt-mobile">
<header><b>tt</b> <span class="tag">v8</span><span class="tag" id="upd"></span><span class="me" id="me" onclick="setMe()"></span>
<select id="theme" class="theme" onchange="setTheme(this.value)" aria-label="테마">
<option value="pixel" selected>픽셀</option>
<option value="newsprint">신문</option>
<option value="terminal">터미널</option>
<option value="swiss">스위스</option>
<option value="ticket">티켓</option>
<option value="blueprint">청사진</option>
<option value="soft">소프트</option>
</select></header>
<main id="list"></main>
<nav id="tabs"></nav>
<div class="toast" id="toast"></div>
<div id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<meta name="tt-build" content="__TT_BUILD__">
<script src="/js/m-core.js"></script>
<script src="/js/m-view.js"></script>
<script src="/js/m-act.js"></script>
<script src="/js/m-main.js"></script>

</body>
</html>
