<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>think-tank</title>
<link rel="icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#101418; --panel:#1a2026; --line:#2a333c; --fg:#d8dee4; --dim:#8b98a5; --acc:#58a6ff; --warn:#d29922; --done:#3fb950; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header b { color:var(--acc); }
  header small { color:var(--dim); }
  main { display:flex; height:calc(100vh - 45px); }
  #board { flex:1; display:flex; gap:8px; padding:12px; overflow-x:auto; }
  .col { min-width:190px; width:190px; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; }
  .col h3 { margin:0 0 8px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  .card { background:#222b34; border:1px solid var(--line); border-radius:5px; padding:6px 8px; margin-bottom:6px; cursor:pointer; }
  .card:hover { border-color:var(--acc); }
  .card.archived { opacity:.4; border-style:dashed; }
  .card.stale { border-color:var(--warn); border-style:dashed; }
  @keyframes hbpulse { 0%,100% { opacity:1; } 50% { opacity:.28; } }
  .card.done { border-left:3px solid var(--done); }
  .card.done p { color:var(--done); opacity:.85; }
  .sub.done > .st { color:var(--done); }
  .sub.done { color:rgba(63,185,80,.85); }
  .card .lease { font-size:10px; }
  .card .id { color:var(--dim); font-size:11px; }
  .card p { margin:2px 0 0; word-break:keep-all; }
  .sub { margin:4px 0 0 6px; border-left:1px dashed var(--line); padding-left:6px; color:var(--fg); }
  .sub:hover { color:#fff; }
  .st { font-size:9px; opacity:.75; }
  .run-chip { font-size:10px; border-radius:3px; padding:0 4px; white-space:nowrap; }
  .run-queued { color:var(--dim); border:1px solid var(--line); }
  .run-running { color:var(--done); }
  .run-running.aging { opacity:.6; }
  .run-stalled, .run-failed { color:#f85149; }
  .run-finished { color:var(--dim); }
  .blink { animation: rblink 1.2s steps(2,start) infinite; }
  @keyframes rblink { 50% { opacity:.25; } }
  #runbanner { color:var(--dim); font-size:11px; white-space:nowrap; }
  #runbanner a { text-decoration:none; }
  .tag { font-size:10px; color:var(--acc); }
  #detail { width:420px; border-left:1px solid var(--line); padding:14px; overflow-y:auto; }
  #detail h2 { font-size:14px; margin:0 0 2px; }
  #detail .meta { color:var(--dim); font-size:11px; margin-bottom:10px; }
  #detail pre { white-space:pre-wrap; word-break:keep-all; background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:8px; }
  .cmt { border-left:2px solid var(--acc); border-bottom:1px dashed var(--line); margin:6px 0; padding:2px 8px 6px; }
  .cmt:last-of-type { border-bottom:none; }
  .cmt.result { border-left-color:var(--done); }
  .cmt small { color:var(--dim); }
  button, input, select, textarea { font:inherit; background:#222b34; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 8px; }
  button:hover { border-color:var(--acc); cursor:pointer; }
  form { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .child { margin-left:12px; border-left:1px dashed var(--line); padding-left:8px; }
  .k { color:var(--acc); }
  #dclose { display:none; position:sticky; top:0; float:right; z-index:11; }
  @media (max-width:720px) {
    header { flex-wrap:wrap; gap:8px; }
    main { flex-direction:column; height:auto; }
    #board { padding:8px; }
    .col { min-width:170px; width:170px; }
    #dclose { display:block; }
    #detail { position:fixed; left:0; right:0; bottom:0; width:auto; max-height:62vh;
      border-left:none; border-top:1px solid var(--acc); background:var(--bg); z-index:10;
      transform:translateY(100%); transition:transform .2s ease; }
    #detail.open { transform:none; }
    body { padding-bottom:8px; }
  }
</style>
</head>
<body>
<header><b>think-tank</b><small id="counts"></small>
  <form style="margin:0;display:flex;gap:6px" onsubmit="return newIssue(event)">
    <input name="title" placeholder="새 이슈 등록" size="24" required>
    <select name="state"><option>todo</option><option>backlog</option></select>
    <button>등록</button>
  </form>
  <span style="flex:1"></span>
  <select id="lab" onchange="load()" style="color:var(--fg);background:var(--panel);border:1px solid var(--line)"></select>
  <label style="color:var(--dim);display:flex;align-items:center;gap:4px">archived
    <input type="checkbox" id="arch" onchange="load()"></label>
  <button onclick="toggleAgents()" id="agentbtn">Agents 0</button>
  <button onclick="toggleCancelled()" id="cxbtn" title="cancel된 카드 열 표시/숨김">취소됨</button>
  <a href="/api.html" style="color:var(--acc)">API(AI)</a>
  <a href="/docs" style="color:var(--acc)">OpenAPI</a>
  <button onclick="load()">새로고침</button>
<small id="runbanner" title="tmux 실행형 dispatch(러너 수신) — 실행 상태는 카드의 TT 상태와 독립"></small>
</header>
<main>
  <div id="board"></div>
  <div id="detail"><button id="dclose" onclick="document.getElementById('detail').classList.remove('open')">✕ 닫기</button><div id="dcontent"><p style="color:var(--dim)">카드를 선택하세요.</p></div></div>
  <div id="agentpanel" style="display:none;position:fixed;top:44px;right:10px;width:380px;max-height:70vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5)"></div>
</main>
<script>
const COLS = ["backlog","todo","in_progress","review","blocked","done"];
let SHOW_CX = localStorage.getItem("tt-show-cancelled") === "1";
function toggleCancelled() { SHOW_CX = !SHOW_CX; localStorage.setItem("tt-show-cancelled", SHOW_CX ? "1" : "0"); load(); }
const API = "";
let current = null;
const RUN_BLINK_S = 90;          // running blink 임계: now-last_progress_at < 90s (계약 §2.4)
let ACTIVE_ROWS = null;          // GET /agents/active 수신 결과. null=아직 수신 전(미표시), []=활성 없음
let ACTIVE_ERR = false;          // 직전 조회 실패(마지막 표시 유지 + 실패 문구)
const esc = s => (s === null || s === undefined ? "" : String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"));
const hueOf = s => { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
const tsParse = t => new Date(t.replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
const leaseInfo = i => {
  if (!i.lease_by) return i.state === "in_progress" ? { color:"#566068", text:"무표기 진행", stale:false } : null;
  const stale = i.lease_expires && tsParse(i.lease_expires) < new Date();
  const alive = i.heartbeat_at && (new Date() - tsParse(i.heartbeat_at)) < 180000;
  const h = hueOf(i.lease_by);
  return { color: `hsl(${h},70%,55%)`, agent: i.lease_by, text: stale ? "⌛만료" : alive ? "●작업중" : "🔒" + i.lease_by, stale, alive };
};

async function j(path, opts) {
  const r = await fetch(API + path, opts);
  if (!r.ok) { alert((await r.json()).detail || r.status); throw new Error(r.status); }
  return r.json();
}
const jQuiet = async path => {   // 진행 조회 전용: 실패해도 alert/throw 없는 조용한 폴링
  try { const r = await fetch(API + path); if (!r.ok) throw new Error(r.status); return await r.json(); }
  catch (e) { return null; }
};
const post = (path, body) => j(path, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify(body)});
const patch = (id, body) => j("/issues/"+id, {method:"PATCH", headers:{"content-type":"application/json"}, body: JSON.stringify(body)});

let agents = [];
let LAST = [];
async function refreshAgents() {
  try { agents = await j("/agents"); } catch (e) { agents = []; }
  document.getElementById("agentbtn").textContent = "Agents " + agents.filter(a=>a.enabled).length;
}

// ── tmux 실행형 dispatch 진행 표시 (계약 M3EREF97 §2.3/§2.4) ──────────────
// run_state 의미: ''=실행 정보 없음(미표시) · queued=회색 · running=blink(진행 관측 fresh)/aging(관측 오래됨)
// · stalled=적색(러너 stall_check 판정만 노출, 보드 재계산 금지) · finished=활성 소멸 · failed=적색(전달 status와 별개).
function runStateOfIssue(issueId) {
  const rows = (ACTIVE_ROWS || []).filter(a => a.issue_id === issueId && a.run_state);
  if (!rows.length) return null;
  return rows.reduce((best, r) => {
    const rank = { stalled: 3, running: 2, queued: 1 }[r.run_state] || 0;
    return rank > best.rank ? { row: r, rank } : best;
  }, { row: rows[0], rank: 0 }).row;
}
function chipFor(issueId) {
  const a = runStateOfIssue(issueId);
  if (!a) return "";                              // 실행 정보 없음 = 어떤 표시도 그리지 않는다
  const st = a.run_state;
  let cls = "run-chip run-" + st;
  let label = st;
  if (st === "running") {
    let fresh = false;
    try { fresh = a.last_progress_at && (Date.now() - tsParse(a.last_progress_at).getTime()) < RUN_BLINK_S * 1000; } catch (e) {}
    if (fresh) { cls += " blink"; } else { cls += " aging"; }   // 관측 오래됨 = blink 정지(진행률 아님)
  }
  const title = esc(`dispatch#${a.dispatch_id} · ${a.agent}${a.machine?" @"+a.machine:""}${a.session?" · "+a.session:""}`)
    + (a.last_progress_at ? ` · 마지막 진행 관측 ${esc(String(a.last_progress_at).slice(5,16))}` : "");
  return `<span class="${cls}" title="${title}">${esc(label)} <small>#${esc(String(a.dispatch_id))}</small></span>`;
}
async function refreshActive() {
  const rows = await jQuiet("/agents/active");
  const banner = document.getElementById("runbanner");
  if (rows === null) {                              // 조회 실패: 마지막 표시 유지 + 실패 문구(조용히, alert 없음)
    ACTIVE_ERR = true;
    if (ACTIVE_ROWS === null) { banner.innerHTML = "<span style=\"color:var(--warn)\">tmux 실행 상태 조회 실패</span>"; }
    else { banner.innerHTML += " <span style=\"color:var(--warn)\">· 상태 조회 실패(마지막 표시 유지)</span>"; }
    return;
  }
  ACTIVE_ERR = false;
  ACTIVE_ROWS = Array.isArray(rows) ? rows.filter(a => ["queued","running","stalled"].includes(a.run_state)) : [];
  renderBanner();
}
function renderBanner() {
  const banner = document.getElementById("runbanner");
  if (ACTIVE_ROWS === null) { banner.innerHTML = ""; return; }          // 초기 수신 전: 빈 상태(추측 표시 금지)
  if (!ACTIVE_ROWS.length) { banner.innerHTML = "tmux 실행 없음"; return; }
  const parts = ACTIVE_ROWS.map(a =>
    `<a href="#${esc(a.issue_id)}" style="color:var(--acc)" title="${esc(a.issue_title || "")}" onclick="event.preventDefault();show('${esc(a.issue_id)}')">#${esc(String(a.dispatch_id))} ${esc(a.issue_id.slice(-4))}·${chipFor(a.issue_id)}</a>`);
  banner.innerHTML = `실행(Active) ${ACTIVE_ROWS.length}: ${parts.join(" · ")}`;
}
function renderRunSection(dsp) {
  const rows = (dsp || []).filter(r => (r.run_state || "") !== "" || r.status === "error");
  if (!rows.length) return "";
  const line = r => {
    let chip = "";
    if (r.run_state) {
      const aging = r.run_state === "running" && r.last_progress_at &&
        (() => { try { return (Date.now() - tsParse(r.last_progress_at).getTime()) >= RUN_BLINK_S*1000; } catch (e) { return true; } })();
      chip = `<span class="run-chip run-${esc(r.run_state)}${r.run_state==="running"?(aging?" aging":" blink"):""}">${esc(r.run_state)}</span>`;
    }
    const tt = r.status === "error" ? ` <span style="color:#f85149" title="dispatch 웹훅 전달 실패(러너 실행 실패와 별개)">전달 error</span>` : "";
    return `<div class="cmt"><small>dispatch#${esc(String(r.id))} · ${esc(r.agent)} · ${chip || (r.status==="ok"?"전달 ok":"")}</small>${tt}${tt&&!chip?` <small style="color:var(--dim)">— 실행 수신 기록 없음(러너 진행 미표시)</small>`:""}`
      + `${r.machine ? `<br><small style="color:var(--dim)">${esc(r.machine)}${r.session?" · "+esc(r.session):""}</small>`:""}`
      + `${r.started_at ? `<br><small style="color:var(--dim)">시작 ${esc(String(r.started_at).slice(5,16))}</small>`:""}`
      + `${r.last_progress_at && (r.run_state==="running"||r.run_state==="stalled") ? `<br><small style="color:var(--dim)">마지막 진행 관측 ${esc(String(r.last_progress_at).slice(5,16))}</small>`:""}`
      + `${r.ended_at ? `<br><small style="color:var(--dim)">종료 ${esc(String(r.ended_at).slice(5,16))}</small>`:""}`
      + `${r.last_tail ? `<br><small style="color:var(--dim)">tail: ${esc(r.last_tail)}</small>`:""}</div>`;
  };
  return `<h3 style="font-size:12px;color:var(--dim)" title="러너(tt-runner)가 수신한 tmux 실행형 dispatch만 표시. run 상태(run)와 웹훅 전달 상태(status)는 별개의 층위입니다 — run failed ≠ 전달 실패.">tmux 실행 진행</h3>${rows.map(line).join("")}`;
}

async function load() {
  let issues = await j("/issues?limit=500&archived=" + (document.getElementById("arch").checked ? "all" : "no"));
  LAST = issues.slice();
  refreshAgents();
  await refreshActive();   // 조용한 조회(실패 시 마지막 표시 유지) — 실패해도 보드 렌더는 계속
  renderBoard(issues);
  if (current) show(current, true);
}

function renderBoard(issues) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const byId = Object.fromEntries(issues.map(i => [i.id, i]));
  const kidsOf = {};
  for (const i of issues) {
    if (i.parent_id && byId[i.parent_id]) (kidsOf[i.parent_id] ||= []).push(i);
  }
  const labSel = document.getElementById("lab");
  const want = labSel.value;
  const labels = [...new Set(issues.flatMap(i => i.labels))].sort();
  labSel.innerHTML = '<option value="">라벨 전체</option>' + labels.map(l => `<option${l===want?" selected":""} value="${esc(l)}">${esc(l)}</option>`).join("");
  if (!labSel.dataset.init) {
    labSel.dataset.init = "1";
    const u = new URLSearchParams(location.search).get("label");
    if (u && labels.includes(u)) { labSel.value = u; return load(); }
  }
  if (want && labels.includes(want)) {
    const keep = new Set();
    const addSub = id => { keep.add(id); (kidsOf[id] || []).forEach(k => addSub(k.id)); };
    for (const i of issues) if (i.labels.includes(want)) {
      addSub(i.id);
      for (let p = i.parent_id; p && byId[p]; p = byId[p].parent_id) keep.add(p);
    }
    issues = issues.filter(i => keep.has(i.id));
  }
  document.getElementById("counts").textContent = issues.length + " issues";
  const roots = issues.filter(i => !i.parent_id || !byId[i.parent_id]);
  const subRows = (parent) => (kidsOf[parent.id] || []).map(k => {
    const li = leaseInfo(k);
    const sty = li ? `cursor:pointer;border-left:3px solid ${li.stale ? "var(--warn)" : li.color};` : k.state === "done" ? "cursor:pointer;border-left:3px solid var(--done);" : "";
    return `<div class="sub${k.state === "done" ? " done" : ""}" style="${sty}" onclick="event.stopPropagation();show('${esc(k.id)}')">
       ${esc(k.id.slice(-4))} <span class="st">[${esc(k.state)}]</span>${li ? ` <span style="color:${li.alive ? "var(--done)" : li.color};${li.alive ? "animation:hbpulse 1.1s infinite" : ""}">${li.stale ? "⌛" : li.alive ? "●" : "🔒"}</span>` : ""} ${chipFor(k.id)} ${esc(k.title)}${k.assignee?` @${esc(k.assignee)}`:""}
       ${(kidsOf[k.id]||[]).length ? subRows(k) : ""}
     </div>`; });
  document.getElementById("cxbtn").style.opacity = SHOW_CX ? "1" : ".45";
  for (const st of (SHOW_CX ? COLS.concat("cancelled") : COLS)) {
    const rootsHere = roots.filter(x => x.state === st);
    const col = document.createElement("div"); col.className = "col";
    col.innerHTML = `<h3>${st} <span>${rootsHere.length}</span></h3>`;
    for (const i of rootsHere) {
      const li = leaseInfo(i);
      const c = document.createElement("div");
      c.className = "card" + (i.archived ? " archived" : "") + (li && li.stale ? " stale" : "") + (i.state === "done" ? " done" : "");
      if (li) c.style.borderLeft = `3px solid ${li.color}`;
      c.innerHTML = `<span class="id">${esc(i.id)}</span>
        ${i.archived ? `<span class="tag">🗄archived</span>` : ""}
        ${li ? `<span class="lease" style="color:${li.alive ? "var(--done)" : li.color};${li.alive ? "animation:hbpulse 1.1s infinite" : ""}"> ${esc(li.text)}</span>` : ""}
        ${i.labels.length?`<span class="tag"> ${esc(i.labels.join(" "))}</span>`:""}
        ${i.state==="blocked"&&i.waiting_for?`<span class="tag" style="color:var(--warn)">⏸ ${esc(i.waiting_for)}${i.waiting_actor?" @"+esc(i.waiting_actor):""}${i.release_ready?" →해제가능":""}</span>`:""}
        <p>${esc(i.title)}</p>${i.assignee?`<span class="tag">@${esc(i.assignee)}</span>`:""}
        ${(kidsOf[i.id]||[]).length ? `<div class="sub">${subRows(i)}</div>` : ""}`;
      c.onclick = () => show(i.id);
      col.appendChild(c);
    }
    board.appendChild(col);
  }
  if (current) show(current, true);
}

async function show(id, keep) {
  if (keep) {
    const ae = document.activeElement;
    if (ae && document.getElementById("detail").contains(ae)) return; // 타이핑 중 재렌더 금지
  }
  current = id;
  if (!keep) history.replaceState(null, "", "#" + id);
  const [i, tree, dsp] = await Promise.all([j("/issues/"+id), j("/issues/"+id+"/tree"), jQuiet("/issues/"+id+"/dispatches")]);
  const d = document.getElementById("dcontent");
  if (!keep) document.getElementById("detail").classList.add("open");
  const kids = (n) => n.tree.map(k => { const li = leaseInfo(k); return `<div class="child" style="${li ? "border-left:3px solid " + (li.stale ? "var(--warn)" : li.color) : ""}"><span class="k">${esc(k.id)}</span> [${esc(k.state)}] ${li ? `<span style="color:${li.alive ? "var(--done)" : li.color};${li.alive ? "animation:hbpulse 1.1s infinite" : ""}">${li.stale ? "⌛" : li.alive ? "●" : "🔒"}</span> ` : ""}${esc(k.title)} ${k.assignee?"@"+esc(k.assignee):""}${k.tree.length?kids(k):""}</div>`; }).join("");
  const nextStates = {backlog:["todo","cancelled"], todo:["in_progress","blocked","backlog","cancelled"],
    in_progress:["blocked","done","todo","review"], review:["todo","blocked","done","cancelled"],
    blocked:["in_progress","todo","cancelled"], done:["todo"], cancelled:["todo"]};
  d.innerHTML = `
    <h2>${esc(i.title)}</h2>
    <div class="meta"><span class="k">${esc(i.id)}</span> · ${esc(i.state)} · ${i.priority?"p"+i.priority:"–"} · ${esc(i.labels.join(" "))||"—"} · ${i.assignee?("@"+esc(i.assignee)):"미배정"} · v${i.version}<br>
    created ${esc(i.created_at)}${i.completed_at?` · done ${esc(i.completed_at)}`:""}
    ${i.lease_by ? `<br>🔒 lease <b>${esc(i.lease_by)}</b> · 만료 ${esc(i.lease_expires?.slice(5,16))} · heartbeat ${esc(i.heartbeat_at?.slice(5,16) || "–")}` : ""}
    ${i.state==="blocked" && i.waiting_for ? `<br>⏸ waiting_for <b>${esc(i.waiting_for)}</b>${i.waiting_actor?` · 책임 ${esc(i.waiting_actor)}`:""}${i.blocked_detail?` · ${esc(i.blocked_detail)}`:""}${i.release_ready?` · <b style="color:var(--warn)">해제 가능</b>`:""}` : ""}</div>
    <pre>${esc(i.body || "(내용 없음)")}</pre>
    <div style="margin:8px 0">이동: ${nextStates[i.state].map(s=>`<button onclick="move('${esc(id)}','${s}')">${s}</button>`).join(" ")}
     ${i.state==="review" ? `· <button onclick="verifyCard('${esc(id)}')">✔ 결과 보고로 완료</button><input id="vfee" placeholder="성공 결과(예: pytest 5 passed)" style="width:220px">` : ""}
     ${i.verified ? `· <span style="color:var(--done)">✓ ${{reported:"결과 보고",approved:"승인 예외",legacy:"기존 완료 기록"}[i.verification_status] || "기존 완료 기록"}${i.verified_evidence?` — ${esc(i.verified_evidence.slice(0,80))}`:""}</span>` : ""}
     ${["done","cancelled"].includes(i.state) ? (i.archived ? `· <button onclick="arch('${esc(id)}',false)">복원</button>` : `· <button onclick="arch('${esc(id)}',true)">아카이브</button>`) : ""}</div>
    <form style="margin:8px 0;display:flex;gap:6px;align-items:center" onsubmit="return assign(event)">
      배정: <input name="agent" size="16" placeholder="예: opencode@thinkpad" value="${esc(i.assignee||"")}">
      <button>배정</button>
      ${i.assignee ? `<button type="button" onclick="return unassignNow()">해제</button>` : ""}
    </form>
    <div>${kids(tree)}</div>
    ${agents.some(a=>a.enabled) ? `
    <form style="margin:8px 0;display:flex;gap:6px;align-items:center" onsubmit="return dispatchTo(event)">
      <select name="agent" style="color:var(--fg);background:var(--panel);border:1px solid var(--line)">${agents.filter(a=>a.enabled).map(a=>`<option value="${esc(a.name)}">${esc(a.name)}</option>`).join("")}</select>
      <input name="au" value="human" size="6" placeholder="지시자">
      <input name="msg" placeholder="agent에게 지시 (hook 발송)" style="flex:1" required>
      <button>지시</button>
    </form>` : `<p style="color:var(--dim);font-size:11px">등록 agent 없음 — 상단 Agents 버튼에서 webhook 등록</p>`}
    ${renderRunSection(dsp)}
    <h3 style="font-size:12px;color:var(--dim)">진행 로그 / 대화</h3>
    ${i.comments.map(c=>{const r=isResultComment(i,c);return `<div class="cmt${r?' result':''}"${r?' title="결과 보고"':''}><small>${esc(c.ts)} <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(${hueOf(c.author)},70%,55%);margin:0 4px 0 2px;vertical-align:1px"></span><b style="color:hsl(${hueOf(c.author)},70%,65%)">${esc(c.author)}</b>${r?' <span style="color:var(--done)">결과</span>':''}</small><br>${esc(c.body)}</div>`;}).join("")||"<p style='color:var(--dim)'>없음</p>"}
    <form onsubmit="return cmt(event)">
      <input name="author" placeholder="agent" value="human" size="8" required>
      <input name="body" placeholder="로그 남기기" style="flex:1" required>
      <button>추가</button>
    </form>
    <form onsubmit="return child(event,'${esc(id)}')">
      <input name="title" placeholder="새 하위 이슈" style="flex:1" required>
      <button>하위 생성</button>
    </form>`;
  if (!keep) {}
}

async function move(id, state) { await patch(id, {state}); load(); }
async function verifyCard(id) {
  const ev = (document.getElementById("vfee")?.value || "").trim();
  await post(`/issues/${id}/verify`, {verifier: "board-ui", evidence: ev});
  load();
}
async function assign(e) { e.preventDefault(); const v = e.target.agent.value.trim(); if (v) await patch(current, {assignee: v}); load(); return false; }
async function unassignNow() { await patch(current, {assignee: ""}); load(); return false; }
async function arch(id, v) { await patch(id, {archived: v}); load(); }
function isResultComment(i, c) {
  if (/verification_status|completion_report|result:|rollup:|→\s*done|마감/.test(c.body)) return true;
  if (i.completed_at) { try { return tsParse(c.ts) >= tsParse(i.completed_at); } catch (e) {} }
  return false;
}

async function cmt(e) {
  e.preventDefault();
  const f = e.target;
  await post(`/issues/${current}/comments`, {author:f.author.value, body:f.body.value});
  f.body.value=""; show(current);
  return false;
}
async function child(e, parent) {
  e.preventDefault();
  await post("/issues", {title:e.target.title.value, parent_id:parent});
  e.target.title.value=""; load();
  return false;
}
async function dispatchTo(e) {
  e.preventDefault();
  const f = e.target;
  await post(`/issues/${current}/dispatch`, {agent:f.agent.value, message:f.msg.value, author:f.au.value||"board"});
  f.msg.value = "";
  show(current);
  return false;
}

function toggleAgents() {
  const p = document.getElementById("agentpanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
  if (p.style.display === "block") { renderAgents(); enrichLive(); }
}

async function enrichLive() {
  const seen = new Set();
  for (const i of LAST) {
    const k = i.lease_by || i.assignee;
    if (!k || i.archived || i.state !== "in_progress" || seen.has(k)) continue;
    seen.add(k);
    try {
      const [d, dsp] = await Promise.all([j("/issues/"+i.id), j("/issues/"+i.id+"/dispatches").catch(()=>[])]);
      const mine = (d.comments||[]).filter(c=>c.author===k).slice(-1)[0];
      const last = (dsp||[]).slice(-1)[0];
      const el = document.getElementById("live-"+k);
      if (el && (mine || last))
        el.innerHTML += `<br>${last?`<small style="color:var(--dim)">dispatch#${last.id} ${esc(last.status)}</small><br>`:""}${mine?`<small>최신: ${esc(mine.body.slice(0,90))}</small>`:""}`;
    } catch (e) {}
  }
}

function renderAgents() {
  const p = document.getElementById("agentpanel");
  const cur = {}, legacy = [];
  for (const i of LAST) {
    const k = i.lease_by || i.assignee;
    if (!k || i.archived) continue;
    if (i.state !== "in_progress" && i.state !== "blocked") continue;
    if (!i.lease_by) { legacy.push(i); continue; }
    if (!cur[k] || (i.state === "in_progress" && cur[k].state !== "in_progress")) cur[k] = i;
  }
  const legacyRows = legacy.map(i => `<small style="color:var(--dim)">무lease 진행중 · ${esc(i.id)} ${esc(i.title.slice(0,40))} — @${esc(i.assignee)} (lease 체계 이전 카드)</small>`).join("<br>");
  const names = [...new Set([...agents.map(a=>a.name), ...Object.keys(cur)])].sort();
  const live = names.map(n => {
    const h = hueOf(n), i = cur[n];
    return `<div class="cmt" style="border-left-color:hsl(${h},70%,55%)"><b style="color:hsl(${h},70%,65%)">${esc(n)}</b>${agents.some(a=>a.name===n)?' <small style="color:var(--dim)">🔑등록</small>':''}<br>
      <small id="live-${esc(n)}">${i ? `현재 <a href="#${esc(i.id)}" style="color:var(--acc)" onclick="event.preventDefault();show('${esc(i.id)}')">${esc(i.id)} ${esc(i.title.slice(0,40))}</a> [${esc(i.state)}] ${i.lease_expires ? (tsParse(i.lease_expires) < new Date() ? '<span style="color:var(--warn)">⌛만료</span>' : 'lease '+esc(i.lease_expires.slice(5,16))) : "lease 없음"}` : "대기 중"}</small></div>`;
  }).join("") || "<p style='color:var(--dim)'>활성 agent 없음</p>";
  p.innerHTML = `<b>agents — 라이브</b>
    <div style="margin:4px 0 6px">${live}</div>
    ${legacyRows ? `<div style="margin:0 0 8px;padding:4px 8px;background:var(--panel);border-radius:5px">${legacyRows}</div>` : ""}
    <hr style="border:none;border-top:1px dashed var(--line);margin:10px 0">
    <b>등록 agent</b> <small style="color:var(--dim)">(webhook hook 대상)</small>
    ${agents.map(a=>`<div class="cmt">
      <small>${esc(a.name)} → <a href="${esc(a.base_url)}" style="color:var(--acc)" target="_blank" rel="noopener">${esc(a.base_url)}</a> ${a.secret?"🔑":""} ${a.enabled?'<span style="color:var(--done)">on</span>':'<span style="color:var(--warn)">off</span>'}</small><br>
      <small style="color:var(--dim)">ok ${esc(a.last_ok?.slice(5,16)||"–")} · err ${esc(a.last_err||"–")}</small>
      <button data-agent="${esc(a.name)}" onclick="agentPatch(this.dataset.agent,{enabled:!${a.enabled?1:0}})">${a.enabled?"비활성":"활성"}</button>
      <button data-agent="${esc(a.name)}" onclick="delAgent(this.dataset.agent)">삭제</button>
    </div>`).join("") || "<p style='color:var(--dim)'>없음</p>"}
    <form onsubmit="return addAgent(event)" style="margin-top:8px">
      <input name="name" placeholder="agent명 (댓글 author와 일치)" required size="14">
      <input name="url" placeholder="http://host:port/hook" style="width:100%;margin-top:4px" required>
      <input name="secret" placeholder="secret(선택, Bearer)" style="width:100%;margin-top:4px">
      <button>등록</button>
    </form>`;
}

async function addAgent(e) {
  e.preventDefault();
  const f = e.target;
  await post("/agents", {name:f.name.value, base_url:f.url.value, secret:f.secret.value});
  await refreshAgents(); renderAgents();
  return false;
}
async function agentPatch(name, body) {
  await j("/agents/"+name, {method:"PATCH", headers:{"content-type":"application/json"}, body: JSON.stringify(body)});
  await refreshAgents(); renderAgents();
}
async function delAgent(name) {
  if (!confirm(name+" 삭제?")) return;
  await j("/agents/"+name, {method:"DELETE"});
  await refreshAgents(); renderAgents();
}

async function newIssue(e) {
  e.preventDefault();
  const f = e.target;
  await post("/issues", {title:f.title.value, state:f.state.value});
  f.title.value=""; load();
  return false;
}
load().then(() => { if (location.hash) show(location.hash.slice(1)).catch(console.error); if (location.search.includes("agents")) toggleAgents(); }).catch(console.error);
setInterval(()=>load().catch(()=>{}), 5000);
</script>
</body>
</html>
