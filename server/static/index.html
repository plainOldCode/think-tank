<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>think-tank</title>
<link rel="icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/css/board.css?v=themes2">
</head>
<body onkeydown="if(event.key==='Escape')closeDetail()">
<header>
  <div class="mast"><b>think-tank</b><small id="counts"></small></div>
  <div class="tools">
  <form onsubmit="return newIssue(event)">
    <input id="newtitle" name="title" placeholder="새 이슈 등록" size="24" required>
    <select name="state"><option>todo</option><option>backlog</option></select>
    <button id="newbtn">등록</button>
  </form>
  <span class="spacer"></span>
  <select id="lab" onchange="load()"></select>
  <label>archived
    <input type="checkbox" id="arch" onchange="load()"></label>
  <button onclick="toggleAgents()" id="agentbtn">Agents 0</button>
  <button onclick="toggleCancelled()" id="cxbtn" title="cancel된 카드 열 표시/숨김">취소됨</button>
  <label id="themelab" for="theme">테마</label>
  <select id="theme" onchange="setTheme(this.value)" aria-label="테마">
    <option value="pixel" selected>픽셀</option>
    <option value="ink">잉크</option>
    <option value="newsprint">신문</option>
    <option value="terminal">터미널</option>
    <option value="swiss">스위스</option>
    <option value="ticket">티켓</option>
    <option value="blueprint">청사진</option>
    <option value="soft">소프트</option>
  </select>
  <a href="/agent-board">에이전트 보드<span id="ab-badge" style="display:none;margin-left:4px;padding:0 5px;border:2px solid currentColor;font-size:11px"></span></a>
  <a href="/api.html">API(AI)</a>
  <a href="/docs">OpenAPI</a>
  <button id="reloadbtn" onclick="load()">새로고침</button>
  </div>
<small id="runbanner" title="tmux 실행형 dispatch(러너 수신) — 실행 상태는 카드의 TT 상태와 독립"></small>
</header>
<main>
  <div id="board"></div>
  <div id="detail"><button id="dclose" onclick="closeDetail()">✕ 닫기</button><div id="dcontent"><p id="dpick" style="color:var(--dim)">카드를 선택하세요.</p></div></div>
  <div id="agentpanel" style="display:none"></div>
</main>
<script src="/js/tt-util.js"></script>
<script src="/js/tt-run.js"></script>
<script src="/js/tt-agents.js"></script>
<script src="/js/tt-board.js"></script>
<script src="/js/tt-detail.js"></script>
<script src="/js/tt-verify.js"></script>
<script src="/js/tt-board-badge.js"></script>
<script src="/js/tt-main.js"></script>
</body>
</html>
