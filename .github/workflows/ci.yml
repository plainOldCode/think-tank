name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install fastapi uvicorn pydantic httpx pytest
      - run: bash scripts/secret-scan.sh .
      - run: pytest tests/ -q
      - run: node tests/smoke_mobile.mjs
      - run: node tests/smoke_theme_wiring.mjs
