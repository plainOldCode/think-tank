name: ci
on:
  pull_request:
  push:
    branches: [turbo]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv venv --python 3.12 .venv
      - run: uv pip install -p .venv/bin/python fastapi uvicorn httpx pytest coverage
      - run: bash scripts/secret-scan.sh .
      - run: .venv/bin/python -m pytest tests/ -q
      - run: node tests/smoke_turbo_ui.mjs
      - run: PATH="$PWD/.venv/bin:$PATH" bash scripts/scenario-coverage.sh
